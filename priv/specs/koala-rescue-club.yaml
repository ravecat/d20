    koalaBonusAction:
      type: object
      required:
        - kind
        - target_cell
      properties:
        kind:
          const: koala
        target_cell:
          $ref: "#/components/schemas/cellRef"
      additionalProperties: false
    volunteerBonusAction:
      type: object
      required:
        - kind
      properties:
        kind:
          const: volunteer
      additionalProperties: false
    hospitalBonusAction:
      type: object
      required:
        - kind
        - hospital_id
      properties:
        kind:
          const: hospital
        hospital_id:
          type: string
          enum:
            - hospital_1_left
            - hospital_1_right
            - hospital_2
            - hospital_3
            - hospital_4
