asyncapi: 3.0.0
info:
  title: Koala Rescue Club Session Async API
  version: 0.9.0
  description: >
    Real-time async API for Koala Rescue Club game sessions.

    Clients join a session topic, start the game, submit Koala Rescue Club
    turns, and receive authoritative caller-specific session projections. Die
    rolls are scheduled and performed by the server.
  license:
    name: MIT
  tags:
    - name: session
      description: Game-session messaging
    - name: koala-rescue-club
      description: Koala Rescue Club commands and projections
    - name: channel-protocol
      description: Channel protocol messages
servers:
  userProduction:
    host: "{domain}"
    pathname: /socket/websocket
    protocol: wss
    description: Production WebSocket endpoint for clients
    variables:
      domain:
        $ref: "#/components/serverVariables/domain"
    security:
      - $ref: "#/components/securitySchemes/channelAuthToken"
    bindings:
      ws:
        method: GET
        query:
          $ref: "#/components/schemas/socketConnectQuery"
        bindingVersion: 0.1.0
  userDevelopment:
    host: "{domain}:{port}"
    pathname: /socket/websocket
    protocol: ws
    description: Local WebSocket endpoint for clients
    variables:
      domain:
        default: localhost
      port:
        $ref: "#/components/serverVariables/port"
    security:
      - $ref: "#/components/securitySchemes/channelAuthToken"
    bindings:
      ws:
        method: GET
        query:
          $ref: "#/components/schemas/socketConnectQuery"
        bindingVersion: 0.1.0
defaultContentType: application/json
channels:
  gameSession:
    address: "session:{session_id}"
    title: Koala Rescue Club Game Session
    summary: WebSocket channel for a single Koala Rescue Club session
    description: >
      Stateful channel for one game session. A successful join tracks player
      presence and returns the initial session projection in the join response.
      Accepted game commands receive an empty success response and publish the
      resulting caller-specific projection when session state changes.
    servers:
      - $ref: "#/servers/userProduction"
      - $ref: "#/servers/userDevelopment"
    parameters:
      session_id:
        description: Session identifier assigned when the session is created.
        examples:
          - 6f218f3c-6b82-4d8d-9f9f-dc5af24118ee
    messages:
      joinSessionRequest:
        $ref: "#/components/messages/joinSessionRequest"
      joinSessionReply:
        $ref: "#/components/messages/joinSessionReply"
      channelError:
        $ref: "#/components/messages/channelError"
      channelClosed:
        $ref: "#/components/messages/channelClosed"
      sessionProjection:
        $ref: "#/components/messages/sessionProjection"
      startSession:
        $ref: "#/components/messages/startSession"
      select:
        $ref: "#/components/messages/select"
      deselect:
        $ref: "#/components/messages/deselect"
      reset:
        $ref: "#/components/messages/reset"
      submit:
        $ref: "#/components/messages/submit"
      circleTree:
        $ref: "#/components/messages/circleTree"
      circleKoala:
        $ref: "#/components/messages/circleKoala"
      commandReply:
        $ref: "#/components/messages/commandReply"
    bindings:
      ws:
        method: GET
        bindingVersion: 0.1.0
operations:
  joinSession:
    action: send
    channel:
      $ref: "#/channels/gameSession"
    summary: Join a Koala Rescue Club session topic
    description: |
      Client joins `session:{session_id}`. On success, the server replies with
      the current caller-specific session projection and tracks player presence.
    messages:
      - $ref: "#/channels/gameSession/messages/joinSessionRequest"
    reply:
      channel:
        $ref: "#/channels/gameSession"
      messages:
        - $ref: "#/channels/gameSession/messages/joinSessionReply"
  startSession:
    action: send
    channel:
      $ref: "#/channels/gameSession"
    summary: Start the session
    description: |
      The session owner sends `start` with an empty payload while the session is
      waiting for players and the game is ready. The server then schedules the
      first automatic die roll.
    messages:
      - $ref: "#/channels/gameSession/messages/startSession"
    reply:
      channel:
        $ref: "#/channels/gameSession"
      messages:
        - $ref: "#/channels/gameSession/messages/commandReply"
  select:
    action: send
    channel:
      $ref: "#/channels/gameSession"
    summary: Add one cell to the caller's pending shape selection
    description: |
      A pending player sends `select` with full context for the first cell or
      only a target cell to continue a stored compatible selection.
    messages:
      - $ref: "#/channels/gameSession/messages/select"
    reply:
      channel:
        $ref: "#/channels/gameSession"
      messages:
        - $ref: "#/channels/gameSession/messages/commandReply"
  deselect:
    action: send
    channel:
      $ref: "#/channels/gameSession"
    summary: Remove one cell from the caller's pending shape selection
    messages:
      - $ref: "#/channels/gameSession/messages/deselect"
    reply:
      channel:
        $ref: "#/channels/gameSession"
      messages:
        - $ref: "#/channels/gameSession/messages/commandReply"
  reset:
    action: send
    channel:
      $ref: "#/channels/gameSession"
    summary: Clear the caller's pending shape selection
    messages:
      - $ref: "#/channels/gameSession/messages/reset"
    reply:
      channel:
        $ref: "#/channels/gameSession"
      messages:
        - $ref: "#/channels/gameSession/messages/commandReply"
  submit:
    action: send
    channel:
      $ref: "#/channels/gameSession"
    summary: Commit the stored complete shape selection and its bonuses
    description: |
      The client sends ordered bonus decisions. The server revalidates and
      atomically commits the caller's stored complete selection.
    messages:
      - $ref: "#/channels/gameSession/messages/submit"
    reply:
      channel:
        $ref: "#/channels/gameSession"
      messages:
        - $ref: "#/channels/gameSession/messages/commandReply"
  circleTree:
    action: send
    channel:
      $ref: "#/channels/gameSession"
    summary: Circle one tree cell
    description: |
      A pending player sends `circle_tree` after the automatic roll to circle a
      single valid tree cell and optionally resolve unlocked bonuses.
    messages:
      - $ref: "#/channels/gameSession/messages/circleTree"
    reply:
      channel:
        $ref: "#/channels/gameSession"
      messages:
        - $ref: "#/channels/gameSession/messages/commandReply"
  circleKoala:
    action: send
    channel:
      $ref: "#/channels/gameSession"
    summary: Circle one koala cell
    description: |
      A pending player sends `circle_koala` after the automatic roll to circle a
      single valid koala cell containing a tree and optionally resolve unlocked
      bonuses.
    messages:
      - $ref: "#/channels/gameSession/messages/circleKoala"
    reply:
      channel:
        $ref: "#/channels/gameSession"
      messages:
        - $ref: "#/channels/gameSession/messages/commandReply"
  receiveSessionProjection:
    action: receive
    channel:
      $ref: "#/channels/gameSession"
    summary: Receive the latest Koala Rescue Club session projection
    description: |
      Server pushes `projection` after accepted state changes, automatic rolls,
      and player-presence changes.
    messages:
      - $ref: "#/channels/gameSession/messages/sessionProjection"
  receiveSessionError:
    action: receive
    channel:
      $ref: "#/channels/gameSession"
    summary: Receive a session-channel error
    messages:
      - $ref: "#/channels/gameSession/messages/channelError"
  receiveSessionClose:
    action: receive
    channel:
      $ref: "#/channels/gameSession"
    summary: Receive a session-channel close
    messages:
      - $ref: "#/channels/gameSession/messages/channelClosed"
components:
  serverVariables:
    domain:
      description: Public server hostname.
    port:
      default: "5000"
      description: Local endpoint port.
  securitySchemes:
    channelAuthToken:
      type: httpApiKey
      in: header
      name: Sec-WebSocket-Protocol
      description: >
        Auth token transported as a WebSocket subprotocol bearer-token entry.
  messages:
    joinSessionRequest:
      name: phx_join
      title: Join Session
      summary: Join request for a Koala Rescue Club session topic
      tags:
        - name: channel-protocol
      contentType: application/json
      payload:
        $ref: "#/components/schemas/joinPayload"
    joinSessionReply:
      name: phx_reply
      title: Join Session Reply
      summary: Session join success or failure
      tags:
        - name: channel-protocol
      contentType: application/json
      payload:
        $ref: "#/components/schemas/sessionJoinReply"
    channelError:
      name: phx_error
      title: Channel Error
      summary: Channel error event
      tags:
        - name: channel-protocol
      contentType: application/json
      payload:
        $ref: "#/components/schemas/channelSystemPayload"
    channelClosed:
      name: phx_close
      title: Channel Closed
      summary: Channel close event
      tags:
        - name: channel-protocol
      contentType: application/json
      payload:
        $ref: "#/components/schemas/channelSystemPayload"
    sessionProjection:
      name: projection
      title: Koala Rescue Club Session Projection
      summary: Authoritative session state with caller-specific turn options and permissions
      contentType: application/json
      payload:
        $ref: "#/components/schemas/session"
    startSession:
      name: start
      title: Start Session
      summary: Request to start the current session
      contentType: application/json
      payload:
        $ref: "#/components/schemas/emptyPayload"
    select:
      name: select
      title: Select Turn Cell
      summary: Add one legal cell to the caller's stored shape selection
      contentType: application/json
      payload:
        $ref: "#/components/schemas/selectPayload"
    deselect:
      name: deselect
      title: Deselect Turn Cell
      summary: Remove one cell from the caller's stored shape selection
      contentType: application/json
      payload:
        $ref: "#/components/schemas/deselectPayload"
    reset:
      name: reset
      title: Reset Turn Selection
      summary: Clear the caller's stored shape selection
      contentType: application/json
      payload:
        $ref: "#/components/schemas/emptyPayload"
    submit:
      name: submit
      title: Submit Turn
      summary: Commit a complete shape selection and ordered bonus decisions
      contentType: application/json
      payload:
        $ref: "#/components/schemas/submitTurnSelectionPayload"
    circleTree:
      name: circle_tree
      title: Circle Tree
      summary: Circle a tree in one cell
      contentType: application/json
      payload:
        $ref: "#/components/schemas/singleCellTurnPayload"
    circleKoala:
      name: circle_koala
      title: Circle Koala
      summary: Circle a koala in one cell
      contentType: application/json
      payload:
        $ref: "#/components/schemas/singleCellTurnPayload"
    commandReply:
      name: phx_reply
      title: Command Reply
      summary: Success or failure reply for session commands
      tags:
        - name: channel-protocol
      contentType: application/json
      payload:
        $ref: "#/components/schemas/commandReply"
  schemas:
    socketConnectQuery:
      type: object
      description: Transport query parameters.
      properties:
        vsn:
          type: string
          const: 2.0.0
          description: Channel serializer version.
      required:
        - vsn
      additionalProperties: true
    joinPayload:
      type: object
      description: Channel join payload. Current channels ignore it.
      additionalProperties: true
    channelSystemPayload:
      type: object
      description: Channel protocol payload for lifecycle events.
      additionalProperties: true
    emptyPayload:
      type: object
      additionalProperties: false
    emptyReplyResponse:
      type: object
      additionalProperties: false
    sessionJoinReply:
      oneOf:
        - type: object
          required:
            - status
            - response
          properties:
            status:
              const: ok
            response:
              $ref: "#/components/schemas/session"
          additionalProperties: false
        - type: object
          required:
            - status
            - response
          properties:
            status:
              const: error
            response:
              $ref: "#/components/schemas/joinError"
          additionalProperties: false
    commandReply:
      oneOf:
        - type: object
          required:
            - status
            - response
          properties:
            status:
              const: ok
            response:
              $ref: "#/components/schemas/emptyReplyResponse"
          additionalProperties: false
        - type: object
          required:
            - status
            - response
          properties:
            status:
              const: error
            response:
              $ref: "#/components/schemas/commandError"
          additionalProperties: false
    joinError:
      type: object
      required:
        - reason
      properties:
        reason:
          type: string
          enum:
            - forbidden
            - session_not_found
      additionalProperties: false
    commandError:
      type: object
      required:
        - reason
      properties:
        reason:
          $ref: "#/components/schemas/commandErrorReason"
      additionalProperties: false
    commandErrorReason:
      type: string
      enum:
        - forbidden
        - session_not_found
        - invalid_command
        - invalid_identity
        - not_owner
        - invalid_player_count
        - invalid_phase
        - not_joined
        - unknown_player
        - already_submitted
        - roll_already_exists
        - missing_roll
        - invalid_die_value
        - insufficient_volunteers
        - invalid_action
        - mixed_action
        - invalid_shape
        - no_legal_placement
        - missing_turn_selection
        - incomplete_turn_selection
        - invalid_target
        - invalid_area
        - inaccessible_area
        - occupied
        - koala_requires_tree
        - bonus_not_unlocked
        - bonus_already_resolved
        - invalid_bonus
        - invalid_hospital
        - invalid_skybridge
        - invalid_badge
        - finished
        - unknown_command
    session:
      type: object
      description: Authoritative caller-specific Koala Rescue Club session projection.
      required:
        - id
        - self
        - phase
        - owner_id
        - members
        - game
        - permissions
        - options
        - selection
      properties:
        id:
          type: string
          format: uuid
        self:
          $ref: "#/components/schemas/participantId"
          description: Actor id of the current caller for this projection.
        phase:
          type: string
          enum:
            - waiting_for_players
            - in_progress
            - finished
        owner_id:
          $ref: "#/components/schemas/participantId"
        members:
          type: object
          description: Session members keyed by participant id.
          additionalProperties:
            $ref: "#/components/schemas/sessionMember"
        game:
          $ref: "#/components/schemas/game"
        permissions:
          $ref: "#/components/schemas/permissions"
        options:
          $ref: "#/components/schemas/turnOptions"
        selection:
          description: Caller-owned unfinished selection, or null when none is actionable.
          oneOf:
            - $ref: "#/components/schemas/turnSelection"
            - type: "null"
      additionalProperties: false
    permissions:
      type: object
      description: Caller-specific permissions computed from session and game state.
      required:
        - can_start_game
        - can_roll
        - can_submit_turn
      properties:
        can_start_game:
          type: boolean
        can_roll:
          type: boolean
          const: false
          description: Always false because Koala Rescue Club rolls are automatic.
        can_submit_turn:
          type: boolean
      additionalProperties: false
    sessionMember:
      type: object
      required:
        - online_at
      properties:
        online_at:
          type: integer
          minimum: 0
          description: Unix epoch time in seconds.
        display_name:
          type: string
        avatar:
          oneOf:
            - type: string
              format: uri
            - type: "null"
        bot:
          type: boolean
          default: false
          description: True when the participant is a server-controlled opponent.
        bot_difficulty:
          type: string
          enum:
            - easy
            - normal
            - hard
          description: Strategy level used by a server-controlled opponent.
      additionalProperties: true
    participantId:
      type: string
      description: Stable participant identifier.
      minLength: 1
    game:
      type: object
      description: Authoritative Koala Rescue Club game state.
      required:
        - sheet
        - mode
        - phase
        - round
        - turn
        - players
        - roll
        - scores
      properties:
        sheet:
          $ref: "#/components/schemas/sheetId"
        mode:
          description: Mode captured from the accepted roster when the game starts.
          oneOf:
            - type: string
              enum:
                - solo
                - multiplayer
            - type: "null"
        phase:
          $ref: "#/components/schemas/gamePhase"
        round:
          type: integer
          minimum: 1
          maximum: 2
        turn:
          type: integer
          minimum: 0
          maximum: 30
        players:
          type: object
          description: Game players keyed by participant id.
          additionalProperties:
            $ref: "#/components/schemas/player"
        roll:
          oneOf:
            - $ref: "#/components/schemas/dieRoll"
            - type: "null"
        scores:
          type: object
          description: Final scores keyed by participant id. Empty until finished.
          additionalProperties:
            $ref: "#/components/schemas/finalScore"
      additionalProperties: false
    sheetId:
      type: string
      enum:
        - dharug
        - yugambeh
    gamePhase:
      type: string
      enum:
        - setup
        - ready
        - roll
        - submit
        - finished
    dieRoll:
      type: object
      required:
        - value
      properties:
        value:
          type: integer
          minimum: 1
          maximum: 6
      additionalProperties: false
    player:
      type: object
      required:
        - status
        - sheet
        - badges
        - rounds
        - turns
        - last_action
      properties:
        status:
          type: string
          enum:
            - ready
            - pending
            - submitted
        sheet:
          $ref: "#/components/schemas/playerSheet"
        badges:
          type: object
          description: Badge awards keyed by badge id.
          propertyNames:
            enum:
              - koala_carer
              - tree_lover
              - bridge_buddy
              - people_person
          additionalProperties:
            type: string
            enum:
              - large
              - small
        rounds:
          type: array
          maxItems: 2
          items:
            $ref: "#/components/schemas/roundScore"
        turns:
          type: array
          description: Accepted adjusted die values in chronological order.
          maxItems: 30
          items:
            type: integer
            minimum: 1
            maximum: 6
        last_action:
          description: Most recently accepted primary action for this player.
          oneOf:
            - $ref: "#/components/schemas/lastAction"
            - type: "null"
      additionalProperties: false
    lastAction:
      type: object
      required:
        - turn
        - action
        - die_value
        - target_cells
      properties:
        turn:
          type: integer
          minimum: 1
          maximum: 30
        action:
          type: string
          enum:
            - plant_trees
            - rehome_koalas
            - circle_tree
            - circle_koala
        die_value:
          type: integer
          minimum: 1
          maximum: 6
        target_cells:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/cellRef"
      additionalProperties: false
    playerSheet:
      type: object
      required:
        - volunteers
        - hospitals
        - skybridges
        - bonuses
        - areas
      properties:
        volunteers:
          type: array
          minItems: 6
          maxItems: 6
          items:
            type: string
            enum:
              - available
              - locked
              - used
        hospitals:
          type: object
          properties:
            hospital_1_left:
              $ref: "#/components/schemas/hospital"
            hospital_1_right:
              $ref: "#/components/schemas/hospital"
            hospital_2:
              $ref: "#/components/schemas/hospital"
            hospital_3:
              $ref: "#/components/schemas/hospital"
            hospital_4:
              $ref: "#/components/schemas/hospital"
          additionalProperties: false
        skybridges:
          type: array
          items:
            $ref: "#/components/schemas/skybridge"
        bonuses:
          type: array
          items:
            $ref: "#/components/schemas/bonusProjection"
        areas:
          type: object
          description: Sheet areas keyed by area id.
          propertyNames:
            $ref: "#/components/schemas/areaId"
          additionalProperties:
            $ref: "#/components/schemas/areaProjection"
      additionalProperties: false
    hospital:
      type: object
      required:
        - size
        - score
        - filled
      properties:
        size:
          type: integer
          minimum: 1
        score:
          type: integer
        penalty:
          type: integer
          maximum: 0
        filled:
          type: integer
          minimum: 0
      additionalProperties: false
    skybridge:
      type: object
      required:
        - from
        - to
      properties:
        from:
          $ref: "#/components/schemas/areaId"
        to:
          $ref: "#/components/schemas/areaId"
      additionalProperties: false
    bonusProjection:
      type: object
      required:
        - ref
        - state
        - bonus
      properties:
        ref:
          $ref: "#/components/schemas/bonusRef"
        state:
          type: string
          enum:
            - locked
            - unlocked
            - resolved
        bonus:
          $ref: "#/components/schemas/bonusDetails"
      additionalProperties: false
    bonusDetails:
      type: object
      required:
        - kind
      properties:
        kind:
          type: string
          enum:
            - tree
            - koala
            - volunteer
            - hospital
            - skybridge
        from:
          $ref: "#/components/schemas/areaId"
        to:
          $ref: "#/components/schemas/areaId"
      additionalProperties: false
    areaProjection:
      type: object
      required:
        - accessible
        - rows
      properties:
        accessible:
          type: boolean
        rows:
          type: array
          items:
            type: array
            items:
              oneOf:
                - $ref: "#/components/schemas/cellState"
                - type: "null"
      additionalProperties: false
    cellState:
      type: object
      required:
        - tree
        - koala
      properties:
        tree:
          type: boolean
        koala:
          type: boolean
      additionalProperties: false
    roundScore:
      type: object
      required:
        - trees
        - koalas
        - hospitals
        - total
      properties:
        trees:
          type: integer
          minimum: 0
        koalas:
          type: integer
          minimum: 0
        hospitals:
          type: integer
        total:
          type: integer
      additionalProperties: false
    finalScore:
      type: object
      required:
        - total
        - rank
      properties:
        total:
          type: integer
        rank:
          oneOf:
            - $ref: "#/components/schemas/soloRank"
            - type: "null"
      additionalProperties: false
    soloRank:
      type: string
      enum:
        - junior_club_member
        - club_secretary
        - club_treasurer
        - vice_president
        - president
    turnOptions:
      description: >
        Empty when the caller cannot submit. Otherwise contains every adjusted
        die value, including unaffordable values whose actions object is empty.
      oneOf:
        - type: object
          maxProperties: 0
        - type: object
          required:
            - "1"
            - "2"
            - "3"
            - "4"
            - "5"
            - "6"
          properties:
            "1":
              $ref: "#/components/schemas/turnOption"
            "2":
              $ref: "#/components/schemas/turnOption"
            "3":
              $ref: "#/components/schemas/turnOption"
            "4":
              $ref: "#/components/schemas/turnOption"
            "5":
              $ref: "#/components/schemas/turnOption"
            "6":
              $ref: "#/components/schemas/turnOption"
          additionalProperties: false
    turnOption:
      type: object
      required:
        - volunteer_cost
        - actions
      properties:
        volunteer_cost:
          type: integer
          minimum: 0
          maximum: 3
        actions:
          $ref: "#/components/schemas/turnActions"
      additionalProperties: false
    turnActions:
      type: object
      description: Available primary actions keyed by command action name.
      properties:
        plant_trees:
          $ref: "#/components/schemas/turnActionOption"
        rehome_koalas:
          $ref: "#/components/schemas/turnActionOption"
        circle_tree:
          $ref: "#/components/schemas/turnActionOption"
        circle_koala:
          $ref: "#/components/schemas/turnActionOption"
      additionalProperties: false
    turnActionOption:
      type: object
      required:
        - available_cells
      properties:
        available_cells:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            $ref: "#/components/schemas/cellRef"
      additionalProperties: false
    turnSelection:
      type: object
      required:
        - action
        - die_value
        - volunteers_used
        - required_cells
        - selected_cells
        - available_cells
        - complete
        - bonus_options
      properties:
        action:
          type: string
          enum:
            - plant_trees
            - rehome_koalas
        die_value:
          type: integer
          minimum: 1
          maximum: 6
        volunteers_used:
          type: integer
          minimum: 0
          maximum: 3
        required_cells:
          type: integer
          minimum: 2
          maximum: 4
        selected_cells:
          type: array
          maxItems: 4
          uniqueItems: true
          items:
            $ref: "#/components/schemas/cellRef"
        available_cells:
          type: array
          uniqueItems: true
          items:
            $ref: "#/components/schemas/cellRef"
        complete:
          type: boolean
        bonus_options:
          type: array
          items:
            $ref: "#/components/schemas/turnBonusOption"
      additionalProperties: false
    turnBonusOption:
      type: object
      required:
        - ref
        - bonus
      properties:
        ref:
          $ref: "#/components/schemas/bonusRef"
        bonus:
          $ref: "#/components/schemas/bonusDetails"
      additionalProperties: false
    selectPayload:
      oneOf:
        - type: object
          required:
            - action
            - die_value
            - volunteers_used
            - target_cell
          properties:
            action:
              type: string
              enum:
                - plant_trees
                - rehome_koalas
            die_value:
              type: integer
              minimum: 1
              maximum: 6
            volunteers_used:
              type: integer
              minimum: 0
              maximum: 3
            target_cell:
              $ref: "#/components/schemas/cellRef"
          additionalProperties: false
        - $ref: "#/components/schemas/deselectPayload"
    deselectPayload:
      type: object
      required:
        - target_cell
      properties:
        target_cell:
          $ref: "#/components/schemas/cellRef"
      additionalProperties: false
    submitTurnSelectionPayload:
      type: object
      required:
        - bonus_actions
      properties:
        bonus_actions:
          type: array
          description: >-
            Ordered actions for bonuses opened during this turn. Bonuses opened during
            this turn but omitted from the array are forfeited when the turn commits.
          items:
            $ref: "#/components/schemas/bonusAction"
      additionalProperties: false
    singleCellTurnPayload:
      type: object
      required:
        - die_value
        - volunteers_used
        - target_cell
      properties:
        die_value:
          type: integer
          minimum: 1
          maximum: 6
        volunteers_used:
          type: integer
          minimum: 0
          maximum: 3
        target_cell:
          $ref: "#/components/schemas/cellRef"
        bonus_actions:
          type: array
          description: >-
            Ordered actions for bonuses opened during this turn. Bonuses opened during
            this turn but omitted from the array are forfeited when the turn commits.
          items:
            $ref: "#/components/schemas/bonusAction"
      additionalProperties: false
    cellRef:
      type: object
      required:
        - area
        - row
        - column
      properties:
        area:
          $ref: "#/components/schemas/areaId"
        row:
          type: integer
          minimum: 0
        column:
          type: integer
          minimum: 0
      additionalProperties: false
    areaId:
      type: string
      enum:
        - a
        - b
        - c
        - d
        - e
        - f
        - g
    bonusRef:
      type: object
      required:
        - area
        - axis
        - index
      properties:
        area:
          $ref: "#/components/schemas/areaId"
        axis:
          type: string
          enum:
            - row
            - column
        index:
          type: integer
          minimum: 0
      additionalProperties: false
    bonusAction:
      type: object
      required:
        - bonus
        - action
      properties:
        bonus:
          $ref: "#/components/schemas/bonusRef"
        action:
          $ref: "#/components/schemas/bonusActionDetails"
      additionalProperties: false
    bonusActionDetails:
      oneOf:
        - $ref: "#/components/schemas/treeBonusAction"
        - $ref: "#/components/schemas/koalaBonusAction"
        - $ref: "#/components/schemas/volunteerBonusAction"
        - $ref: "#/components/schemas/hospitalBonusAction"
        - $ref: "#/components/schemas/skybridgeBonusAction"
        - $ref: "#/components/schemas/skipBonusAction"
    treeBonusAction:
      type: object
      required:
        - kind
        - target_cell
      properties:
        kind:
          const: tree
        target_cell:
          $ref: "#/components/schemas/cellRef"
      additionalProperties: false
    koalaBonusAction:
      type: object
      required:
        - kind
        - target_cell
      properties:
        kind:
          const: koala
        target_cell:
          $ref: "#/components/schemas/cellRef"
      additionalProperties: false
    volunteerBonusAction:
      type: object
      required:
        - kind
      properties:
        kind:
          const: volunteer
      additionalProperties: false
    hospitalBonusAction:
      type: object
      required:
        - kind
        - hospital_id
      properties:
        kind:
          const: hospital
        hospital_id:
          type: string
          enum:
            - hospital_1_left
            - hospital_1_right
            - hospital_2
            - hospital_3
            - hospital_4
      additionalProperties: false
    skybridgeBonusAction:
      type: object
      required:
        - kind
        - to
      properties:
        kind:
          const: skybridge
        to:
          $ref: "#/components/schemas/areaId"
      additionalProperties: false
    skipBonusAction:
      type: object
      required:
        - kind
      properties:
        kind:
          const: skip
      additionalProperties: false
